[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masops-evaluation"
version = "0.1.0"
description = "Evaluation framework for the MAS-Ops multi-agent PR review system against SWE-bench Verified"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Thiago Victoriano", email = "thiago@ophelias.ai" },
]
keywords = ["swe-bench", "multi-agent", "evaluation", "llm", "mas-ops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "swebench>=2.1.0",
    "datasets>=2.18.0",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "anthropic>=0.40.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
select-instances = "masops_evaluation.select_instances:main"
run-evaluation = "masops_evaluation.run_evaluation:main"
aggregate-results = "masops_evaluation.aggregate_results:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["masops_evaluation*"]

[tool.setuptools.package-data]
masops_evaluation = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["src"]
